<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KU Quiz Monitor — Student</title>
<style>
:root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#173047}*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f7f9fb;max-width:440px}
h1{font-size:1rem;margin:0 0 6px}p{font-size:.82rem;line-height:1.5}
.panel{background:white;border:1px solid #d9e2ea;border-radius:10px;padding:12px;margin:10px 0}
button{padding:10px;border-radius:8px;border:1px solid #a9c2c9;background:#eaf5ff;font:inherit;cursor:pointer}
button.primary{background:#087a66;color:white;border-color:#087a66}
button:disabled{opacity:.45}video{width:144px;height:108px;object-fit:cover;background:#111;border-radius:8px}
#status{font-weight:600}small{color:#5b6978} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>
<h1>KU — ตรวจสอบกล้องและไมโครโฟน</h1>
<p>ใช้ระหว่างทำข้อสอบ · ไม่ส่งภาพหรือเสียงไปยัง Student Portal</p>
<section class="panel">
<div class="row"><button class="primary" id="start">เปิดกล้องและไมค์</button><button id="stop" disabled>หยุดตรวจ</button></div>
<p id="status" role="status">ยังไม่เริ่ม</p>
<p id="cameraStatus">กล้อง: รอตรวจ</p>
<p id="micStatus">ไมโครโฟน: รอตรวจ</p>
<p id="faceStatus">ใบหน้า: รอตรวจ</p>
<video id="preview" autoplay playsinline muted></video>
<small>หากกล้องหรือไมค์หยุดทำงาน ระบบจะแจ้งสถานะไปยังหน้าแบบทดสอบ ไม่ใช้การตรวจจับเพียงอย่างเดียวตัดสินว่าทุจริต</small>
</section>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4/face_detection.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
const bridgeMode=query.get('bridge')==='1';
const nonce=query.get('nonce')||'';
const parentOrigin=query.get('parentOrigin')||'';
const needCamera=!bridgeMode||query.get('camera')==='1';
const needMic=!bridgeMode||query.get('mic')==='1';
let stream=null, audioCtx=null, source=null, analyser=null, raf=0, beat=0, faceTimer=0;
let detector=null, busy=false, ready=false, stopping=false, facePresent=null;
function allowedParent(origin){
 try{
  const u=new URL(origin);
  return u.protocol==='https:' && (u.hostname==='script.google.com' ||
    u.hostname==='script.googleusercontent.com' || u.hostname.endsWith('.googleusercontent.com'));
 }catch(e){return false;}
}
const trusted=bridgeMode&&window.opener&&nonce.length===32&&allowedParent(parentOrigin);
function send(type,extra={}){
 if(!trusted)return;
 try{window.opener.postMessage(Object.assign({source:'ku-quiz-monitor-bridge-v1',nonce,type},extra),parentOrigin)}catch(e){}
}
function live(kind){return !!stream&&stream.getTracks().some(t=>t.kind===kind&&t.readyState==='live')}
function health(){
 const cameraLive=needCamera?live('video'):null, micLive=needMic?live('audio'):null;
 return {cameraLive,micLive,facePresent};
}
function heartbeat(){
 const h=health();
 $('cameraStatus').textContent='กล้อง: '+(needCamera?(h.cameraLive?'พร้อม':'หยุดทำงาน'):'ไม่กำหนด');
 $('micStatus').textContent='ไมโครโฟน: '+(needMic?(h.micLive?'พร้อม':'หยุดทำงาน'):'ไม่กำหนด');
 send('HEARTBEAT',h);
}
async function stop(notify=true){
 stopping=true;ready=false;
 clearInterval(beat);clearTimeout(faceTimer);cancelAnimationFrame(raf);
 beat=0;faceTimer=0;raf=0;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 if(source){try{source.disconnect()}catch(e){}source=null}
 if(audioCtx){try{await audioCtx.close()}catch(e){}audioCtx=null}
 analyser=null;detector=null;facePresent=null;
 $('preview').srcObject=null;$('start').disabled=false;$('stop').disabled=true;
 $('status').textContent='หยุดตรวจแล้ว';
 if(notify)send('STOPPED');
 stopping=false;
}
async function detectFace(){
 if(!ready||!detector||!live('video'))return;
 if(!busy&&$('preview').readyState>=2){
  busy=true;
  try{await detector.send({image:$('preview')})}
  catch(e){$('faceStatus').textContent='ใบหน้า: ตัวตรวจจับไม่พร้อม'}
  finally{busy=false}
 }
 if(ready)faceTimer=setTimeout(detectFace,500);
}
async function setupFace(){
 if(!needCamera)return;
 if(typeof FaceDetection==='undefined'){$('faceStatus').textContent='ใบหน้า: ไม่สามารถโหลดตัวตรวจจับ';return}
 try{
  detector=new FaceDetection({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4/'+f});
  detector.setOptions({model:'short',minDetectionConfidence:0.6});
  detector.onResults(r=>{
   facePresent=!!(r.detections&&r.detections.length);
   $('faceStatus').textContent='ใบหน้า: '+(facePresent?'ตรวจพบ':'ไม่พบ');
  });
  detectFace();
 }catch(e){$('faceStatus').textContent='ใบหน้า: ตัวตรวจจับไม่พร้อม'}
}
async function start(){
 await stop(false);
 $('start').disabled=true;$('status').textContent='กำลังขออนุญาตอุปกรณ์...';
 try{
  if(bridgeMode&&!trusted)throw Error('ไม่พบการเชื่อมต่อที่ถูกต้องจาก Student Portal');
  if(!navigator.mediaDevices?.getUserMedia)throw Error('เบราว์เซอร์ไม่รองรับกล้องและไมค์');
  stream=await navigator.mediaDevices.getUserMedia({
   video:needCamera?{facingMode:'user'}:false,audio:needMic
  });
  if((needCamera&&!live('video'))||(needMic&&!live('audio')))throw Error('อุปกรณ์ที่กำหนดไม่พร้อม');
  if(needCamera){$('preview').srcObject=stream;await $('preview').play()}
  else $('preview').hidden=true;
  if(needMic){
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   await audioCtx.resume();source=audioCtx.createMediaStreamSource(stream);
   analyser=audioCtx.createAnalyser();source.connect(analyser);
  }
  for(const track of stream.getTracks()){
   track.addEventListener('ended',()=>{if(!stopping){$('status').textContent='อุปกรณ์หยุดทำงาน';heartbeat()}});
  }
  ready=true;$('start').disabled=true;$('stop').disabled=false;
  $('status').textContent='เปิดอุปกรณ์สำเร็จ · กำลังตรวจสอบ';
  heartbeat();beat=setInterval(heartbeat,3000);
  send('READY',health());
  setupFace();
 }catch(e){
  const message=String(e.name||'Error')+': '+String(e.message||e);
  await stop(false);$('status').textContent='เปิดไม่สำเร็จ: '+message;
  send('ERROR',{message:message.slice(0,180)});
 }
}
$('start').onclick=start;
$('stop').onclick=()=>stop(true);
window.addEventListener('pagehide',()=>{if(ready)send('STOPPED');if(stream)stream.getTracks().forEach(t=>t.stop())});
if(bridgeMode&&!trusted){
 $('status').textContent='กรุณาเปิดหน้าต่างนี้จาก Student Portal';
 $('start').disabled=true;
}
</script></body></html>
